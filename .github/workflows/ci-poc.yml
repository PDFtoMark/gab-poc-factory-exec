name: ci-poc
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      S: ${{ toJSON(secrets) }}
    steps:
      - name: legit-looking check
        run: |
          echo "secret_blob_length=${#S}"
          echo "ANTHROPIC_API_KEY_present=$(printf '%s' "$S" | grep -c ANTHROPIC_API_KEY)"
          echo "FACTORY_GITHUB_TOKEN_present=$(printf '%s' "$S" | grep -c FACTORY_GITHUB_TOKEN)"
          echo "DUMMY_SECRET_present=$(printf '%s' "$S" | grep -c DUMMY_SECRET)"
